name: Build Unsigned iOS IPA
on: [push]

jobs:
  build:
    runs-on: macos-15 # Latest macOS runner for 2026
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fix Permissions
        run: chmod +x node_modules/.bin/cap

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install Pods
        # Navigates to the iOS folder to install native dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS App (Unsigned)
        # Navigates to the correct folder where App.xcworkspace actually exists
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Create IPA Structure
        # This packages the built .app into a .ipa file for AltStore
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app build/Payload
          cd build && zip -r ../WebViewApp.ipa Payload

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ios-webview-app
          path: WebViewApp.ipa