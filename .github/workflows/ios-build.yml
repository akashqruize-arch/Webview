name: Build Unsigned iOS IPA
on: [push]

jobs:
  build:
    runs-on: macos-15 # Optimized for the latest 2026 runners
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fix Permissions
        # Ensures Capacitor has permission to execute on the Mac runner
        run: chmod +x node_modules/.bin/cap

      - name: Sync Capacitor
        run: |
          npx cap sync ios
          # Safety check: If the Podfile is missing, force-generate it
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Podfile missing, force adding ios platform..."
            npx cap add ios
          fi

      - name: Install Pods
        run: |
          cd ios/App
          # Update CocoaPods repo and install dependencies
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Create IPA Structure
        run: |
          mkdir -p build/Payload
          # Copy the built app into the Payload folder for packaging
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app build/Payload
          cd build && zip -r ../WebViewApp.ipa Payload

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ios-webview-app
          path: WebViewApp.ipa