name: Build Unsigned iOS IPA
on: [push]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fix Permissions
        run: chmod +x node_modules/.bin/cap

      - name: Clean & Fresh iOS Platform
        run: |
          # 1. Force remove any existing ios folder to avoid "already exists" errors
          rm -rf ios
          
          # 2. Add and sync platform fresh on the Mac runner
          npx cap add ios
          npx cap sync ios
          
          # 3. EMERGENCY FIX: If the Podfile is still missing, we write it manually
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Podfile missing! Creating manual fallback..."
            cat <<EOF > ios/App/Podfile
            platform :ios, '13.0'
            use_frameworks!
            target 'App' do
              pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
              pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
            end
          EOF
          fi

      - name: Install Pods
        run: |
          cd ios/App
          # Update the repo to ensure we see the latest 2026 pods
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Create IPA Structure
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app build/Payload
          cd build && zip -r ../WebViewApp.ipa Payload

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ios-webview-app
          path: WebViewApp.ipa