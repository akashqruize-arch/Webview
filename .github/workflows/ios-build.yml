name: Build Unsigned iOS IPA
on: [push]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fix Permissions
        run: chmod +x node_modules/.bin/cap

      - name: Clean & Fresh Setup
        run: |
          rm -rf ios
          npx cap add ios
      - name: Debug iOS folder
        run: |
          echo "===== ROOT ====="
          ls
          echo "===== IOS ====="
          ls ios || echo "ios folder not created"
          echo "===== IOS/APP ====="
          ls ios/App || echo "ios/App not created"

          npx cap sync ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Pods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app build/Payload
          cd build && zip -r ../WebViewApp.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-webview-app
          path: WebViewApp.ipa
